# Tampilan sama persis di mode terang maupun gelap (mengikuti sistem hanya untuk sekitar halaman).
# Perlu restart/redeploy setelah diubah.
[theme.light]
base = "light"
primaryColor = "#2F5F98"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#F3F1EC"
textColor = "#1F2328"
font = "sans serif"

[theme.dark]
base = "light"                        # sengaja terang: mode gelap memakai warna yang sama
primaryColor = "#2F5F98"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#F3F1EC"
textColor = "#1F2328"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false